<!doctype html>
<html lang="en" class="dark-mode" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="DRiVE — A story-driven creative platform. Discover, read, and create AI-powered stories in webtoon, illustrated book, and comic strip formats." />
    <meta name="theme-color" content="#141424" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=2" />
    <link rel="manifest" href="/manifest.json?v=2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DRiVE" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=optional" rel="stylesheet" />
    <title>DRiVE — Stories That Move You</title>
    <!-- Early theme init script: prevents any white/light flash before JS bundles load -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('drive_app_settings');
          if (raw) {
            var settings = JSON.parse(raw);
            if (settings.darkMode === false) {
              document.documentElement.classList.remove('dark-mode');
              document.documentElement.setAttribute('data-theme', 'light');
              var meta = document.querySelector('meta[name="theme-color"]');
              if (meta) meta.setAttribute('content', '#F5F0E8');
            }
          }
        } catch (e) {}
      })();
    </script>
    <!-- Critical inline CSS: dark theme default & immediate layout constraints -->
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        background-color: #141424;
        color: #EDE9F6;
        min-height: 100%;
      }
      html:not(.dark-mode), html:not(.dark-mode) body {
        background-color: #F5F0E8;
        color: #2D2438;
      }
      #app {
        background-color: #141424;
        margin: 0 auto;
        min-height: 100svh;
        position: relative;
      }
      html:not(.dark-mode) #app {
        background-color: #F5F0E8;
      }
      .app-shell { display: flex; flex-direction: column; height: 100%; min-height: 100svh; background-color: inherit; }
      .app-content { flex-grow: 1; overflow-y: auto; background-color: inherit; }
      #view-container { background-color: inherit; min-height: 100%; }

      /* Prevent any unstyled image/logo flash before CSS bundle loads */
      img { max-width: 100%; height: auto; }
      .desktop-brand { display: none !important; }
      .desktop-nav { display: none !important; }
      @media (min-width: 1024px) {
        .desktop-brand { display: flex !important; align-items: center; gap: 12px; }
        .desktop-nav { display: flex !important; }
      }
      .desktop-brand__logo {
        width: 38px !important;
        height: 38px !important;
        max-width: 38px !important;
        max-height: 38px !important;
        border-radius: 50% !important;
        object-fit: contain !important;
        background: #ffffff !important;
        padding: 2px !important;
        flex-shrink: 0 !important;
        display: inline-block !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-shell">
        <!-- Main content area -->
        <main class="app-content" id="app-content">
          <!-- View header -->
          <header class="view-header" id="view-header">
            <button class="hamburger-btn" id="hamburger-btn" aria-label="Open menu" style="background:none; border:none; cursor:pointer;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>
            <button class="cm-back-btn" id="cm-back-btn" aria-label="Exit Content Management" style="display:none;" title="Return to Content Management Dashboard">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
              </svg>
              <span class="cm-back-btn-text">Admin</span>
            </button>

            <!-- Desktop Brand (Desktop only) -->
            <a class="desktop-brand" id="desktop-brand" href="#home" aria-label="DRiVE Home" style="display:none;">
              <img src="/drive-logo.png" alt="DRiVE" class="desktop-brand__logo" width="38" height="38" style="width:38px; height:38px; max-width:38px; max-height:38px; border-radius:50%; object-fit:contain; background:#ffffff; padding:2px; display:inline-block;" />
              <span class="desktop-brand__name">DRiVE</span>
            </a>

            <!-- Mobile Title (Hidden on desktop) -->
            <h1 class="view-title" id="view-title">Home</h1>

            <!-- Desktop Navigation Links (Desktop only) -->
            <nav class="desktop-nav" id="desktop-nav" aria-label="Desktop Navigation" style="display:none;">
              <a class="desktop-nav-link" data-route="home">Home</a>
              <a class="desktop-nav-link" data-route="featured">Featured</a>
              <a class="desktop-nav-link" data-route="explore">Explore</a>
              <a class="desktop-nav-link" data-route="library">Library</a>
              <a class="desktop-nav-link" data-route="friends">Friends</a>
              <a class="desktop-nav-link desktop-nav-link--create" data-route="create">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                <span>Create</span>
              </a>
            </nav>

            <div class="header-right-group">
              <!-- Gear & avatar buttons injected by JS -->
            </div>
          </header>

          <!-- Content Management View Top Indicator Banner -->
          <div id="cm-top-banner" class="cm-top-banner" style="display:none;">
            <div class="cm-top-banner-content">
              <span class="cm-pulse-dot"></span>
              <span class="cm-top-banner-pill">🔮 CONTENT MANAGEMENT VIEW</span>
              <span class="cm-top-banner-desc">Live Story Tile Preview (Home · Featured · Explore)</span>
            </div>
            <button id="cm-banner-exit-btn" class="cm-banner-exit-btn" title="Exit to Admin Creation Dashboard">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
              <span>Exit to Admin</span>
            </button>
          </div>

          <!-- Dynamic view container -->
          <div id="view-container"></div>
        </main>

        <!-- Bottom navigation -->
        <div id="nav-container"></div>

        <!-- Modal container -->
        <div id="modal-container"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
